site_name: Basketball Training Programs
site_description: CoachIQ Basketball Training - Ball Handling, Athleticism, Shooting & More

docs_dir: docs
site_dir: _site

use_directory_urls: false

theme:
  name: material
  palette:
    scheme: slate
    primary: deep orange
    accent: amber
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.highlight
  icon:
    logo: material/basketball

extra_css:
  - extra.css

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search

